server {
    listen 80;
    server_name _;

    # Frontend static (Expo web build)
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API — /api/* proxied to FastAPI (routers already use /api prefix)
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # scan/inference có thể mất 30-60s
        proxy_send_timeout 180s;
        client_max_body_size 20M;  # cho phép upload ảnh lớn
    }

    # Static uploads (hình ảnh scan, submission)
    location /uploads/ {
        proxy_pass       http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    # Gzip để giảm tải mạng hotspot
    gzip on;
    gzip_types text/plain application/javascript application/json text/css;
}
